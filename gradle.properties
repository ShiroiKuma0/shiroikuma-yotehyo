android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# Versioning (fork: shiroikuma-yotehyo)
# VERSION_NAME / VERSION_CODE track upstream Fossify Calendar (the code that
# corresponds to the upstream version *name* — 1.10.3 == 20; upstream gradle.properties
# briefly carried 21 from a reverted 1.11.0 release).
# BUILD_NUMBER is our fork increment (the "+N"), stored here as a plain integer.
# The installed versionCode is computed in app/build.gradle.kts as
# VERSION_CODE * 10000 + BUILD_NUMBER (e.g. 20 * 10000 + 1 = 200001); the versionName
# is "VERSION_NAME+<BUILD_NUMBER zero-padded to three digits>" (e.g. 1.10.3+001), so
# APK filenames sort in build order. Padding is text only — the code stays an integer.
VERSION_NAME=1.10.3
VERSION_CODE=20
BUILD_NUMBER=59
# APP_ID is our installed application id; APP_NAMESPACE stays the upstream package
# so generated R/BuildConfig/databinding classes keep resolving in source.
APP_ID=shiroikuma.yotehyo
APP_NAMESPACE=org.fossify.calendar
